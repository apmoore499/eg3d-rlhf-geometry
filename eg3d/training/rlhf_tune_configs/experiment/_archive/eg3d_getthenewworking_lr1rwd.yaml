# @package _global_


defaults:
  - _self_
  - experiment: null
  - override /data: defaults
  - override /rlhf_opt: original
  - override /click_legacy_args: defaults
  - override /click_legacy_args: defaults




ltype: ${rlhf_tune_hpms.tune_type}


#dpoje3ea
nm_vis: 4
eval_metrics_only: false
init_seeds_first: true

train_tick_stop: 40

data:
  nrs: 64
  upsample_64_to_128: true
  downsample_pcd_points: true
  n_point_samples_per_pcd_batch: 2048
  sample_points_face_area: false
  center_points: true
  unit_scale_points: true #j87azjo4
#rlhf_tune_hpms.accum_steps
rlhf_tune_hpms:
  lambda_rwd_model: 1.0 #1.0 #1e-1
  lambda_nose_hard: 1.0 #0.0 #1.0
  update_emas_gdepth: true
  rwd_type: clamped #pairs #clamped #pairs #pairs
  resume_kimg: 2048
  lambda_dmap_l1:  0.0 #1e-2 #0.0 #1e-2
  lambda_sigma_l1:  0.0 #1.0 #1e-1 #1e-2 #0.0 #1e-2 
  n_comparisons: 4
  batch_size: 16 #3 #4
  accum_steps: 8
  scale_sigma_vals: 1.0
  G_gain_scale: 1.0 #0.5 #1.0 #1.0 #1e-1 #compensate for very small batch size
  D_gain_scale: 1.0 #0.5 #1.0 #1.0 #1e-1 #compensate for very small batch size
  G_depth_gain: 1.0
  gamma: 20
  update_G_ema_every_tick: false
  G_sample_noise_mode: 'none'
  G_sample_truncation_psi: 1.0
  G_sample_truncation_cutoff: null
  G_sample_camera_type: zeros
  augmentations:
    _target_: data.custom_transforms.transforms_composition_helper
    dtype: nose_512
    instantiated_transforms:
      normalize:
        _target_: torchvision.transforms.Normalize 
        mean: 0.5
        std: 0.25
      # pad_sigma_before_and_after_random:
      #   _target_: data.custom_transforms.pad_sigma_before_and_after_random
      #   max_len: 10
      # remove_bg_to_zeros:
      #   _target_: data.custom_transforms.remove_bg_to_zeros


clamp_rwd: True
rwd_clamp_max: 0.0 #5.0
#rwd_clamp_min: !!null
rwd_clamp_min: -100
EVALUATE_METRICS: True
#rwd_model_id: f12n5jti #pointnetall, cos act
#rwd_id_final_tuned_weights: /path/to/eg3d-rlhf-geometry/reward_model_training/reward_model_framework/core_modules/RWD_MODELS_FOR_TUNING/f12n5jti/online_learning_trial/f12n5jti_retrain_9.pt

rwd_model_id: s1oeivp1 #resnet3d model, mean agg k83zfe1n  #w406mbr7
#rwd_model_id: 9mp3llqq #resnet3d model 
#rwd_model_id: qyawqy8w #unet model
#yhiewiof
hpms_first_dmaps:
  truncation_psi: 0.25
  truncation_cutoff: 14


pretrained_modules:
  old_G_ema: true     #true  #nb only do this is lambda_sigma_l1 > 0


