# @package _global_


defaults:
  - _self_
  - experiment: null
  - override /data: defaults
  - override /rlhf_opt: original
  - override /click_legacy_args: defaults
  - override /click_legacy_args: defaults




ltype: ${rlhf_tune_hpms.tune_type}


#dpoje3ea
nm_vis: 4
eval_metrics_only: false
init_seeds_first: true

train_tick_stop: 20

data:
  nrs: 64
  upsample_64_to_128: true
  downsample_pcd_points: true
  n_point_samples_per_pcd_batch: 2048
  sample_points_face_area: false
  center_points: true
  unit_scale_points: true #j87azjo4
#rlhf_tune_hpms.accum_steps
rlhf_tune_hpms:
  lambda_rwd_model: 1e-1 #1.0 #e-1 #0.0 #1.0 #1e-1
  lambda_nose_hard: 0.0 #1.0 #0.0 #1.0
  update_emas_gdepth: true
  rwd_type: clamped #clamped #pairs #pairs
  tune_type: ${rlhf_tune_hpms.rwd_type}
  resume_kimg: 2048
  lambda_dmap_l1:  0.0 #1e-2 #0.0 #1e-2
  lambda_sigma_l1:  1e-2 #1.0 #0.0 #1.0 #1e-1 #1e-2 #0.0 #1e-2 
  n_comparisons: 4
  batch_size: 16 #3 #4
  accum_steps: 8
  scale_sigma_vals: 1.0
  gen_c_mult_rwd: 1.0 #changed this one
  G_gain_scale: 1.0 #0.5 #1.0 #1.0 #1e-1 #compensate for very small batch size
  D_gain_scale: 1.0 #0.5 #1.0 #1.0 #1e-1 #compensate for very small batch size
  G_depth_gain: 1.0
  gamma: 20
  update_G_ema_every_tick: true
  G_sample_noise_mode: 'const'
  G_sample_truncation_psi: 0.7
  G_sample_truncation_cutoff: 14
  G_sample_camera_type: zeros
  augmentations:
    _target_: data.custom_transforms.transforms_composition_helper
    dtype: sigma_field_256
    instantiated_transforms:
      normalise_sigma_self:
        _target_: data.custom_transforms.normalise_sigma_self
        min_norm: 0.0
        max_norm: 100.0


clamp_rwd: True
rwd_clamp_max: 10.0 #5.0
#rwd_clamp_min: !!null
rwd_clamp_min: -10
EVALUATE_METRICS: True
