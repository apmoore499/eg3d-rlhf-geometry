# @package _global_


defaults:
  - _self_
  - experiment: null
  - override /data: defaults
  - override /rlhf_opt: original
  - override /click_legacy_args: defaults

#this one is trained on better dataset. we select all 6-tuples and pull out best and worst rank only. higher test acc.

train_tick_stop: 15 


#rlhf_tune_hpms.tune_type


data:
  nrs: 128
  upsample_64_to_128: false
  downsample_pcd_points: true
  n_point_samples_per_pcd_batch: 2048
  sample_points_face_area: false
  center_points: true
  unit_scale_points: true

rlhf_tune_hpms:
  lambda_rwd_model: 1e-1
  lambda_nose_hard: 1.0
  update_emas_gdepth: true
  tune_type: pairs_patches

rwd_model_id: oduj1s85 #gpanet

hpms_first_dmaps:
  truncation_psi: 0.7
  truncation_cutoff: 14



