# @package _global_


defaults:
  - _self_
  - experiment: null
  - override /data: defaults
  - override /rlhf_opt: original
  - override /click_legacy_args: defaults


#dpoje3ea
#nm_vis: 1

train_tick_stop: 12

data:
  nrs: 128
  upsample_64_to_128: false
  downsample_pcd_points: true
  n_point_samples_per_pcd_batch: 2048
  sample_points_face_area: false
  center_points: true
  unit_scale_points: true

rlhf_tune_hpms:
  lambda_rwd_model: 1e-4
  lambda_nose_hard: 0.0
  update_emas_gdepth: true
  rwd_type: pairs
  resume_kimg: 2048
  lambda_dmap_l1:  0.0 #1e-2
  n_comparisons: 10
  batch_size: 2

clamp_rwd: True
rwd_clamp_max: 100
rwd_clamp_min: !!null
#rwd_clamp_min: -100


rwd_model_id: 2gb8fql0 #pcd_as_pt_no_transform, pointnet2
#yhiewiof
hpms_first_dmaps:
  truncation_psi: 0.25
  truncation_cutoff: 14


