# @package _global_


defaults:
  - _self_
  - experiment: null
  - override /data: defaults
  - override /rlhf_opt: original
  - override /click_legacy_args: defaults


#dpoje3ea
#nm_vis: 1

train_tick_stop: 12

data:
  nrs: 64
  upsample_64_to_128: true
  downsample_pcd_points: true
  n_point_samples_per_pcd_batch: 2048
  sample_points_face_area: false
  center_points: true
  unit_scale_points: true #j87azjo4

rlhf_tune_hpms:
  lambda_rwd_model: 1e-4
  lambda_nose_hard: 1.0
  update_emas_gdepth: false
  rwd_type: pairs
  resume_kimg: 1000
  lambda_dmap_l1:  0.0 #1e-2 #0.0 #1e-2
  lambda_sigma_l1:  1.0 #1e-1 #1e-2 #0.0 #1e-2
  n_comparisons: 1 #nb prev 10. try lower = implcit regularisation for it...
  batch_size: 2
  scale_sigma_vals: 1.0
  G_gain_scale: 1.0 #1.0 #1e-1 #compensate for very small batch size
  D_gain_scale: 1.0 #1.0 #1e-1 #compensate for very small batch size
  G_depth_gain: 1.0

clamp_rwd: True
rwd_clamp_max: 0.0
#rwd_clamp_min: !!null
rwd_clamp_min: -100


rwd_model_id: 9n3jht9c #pcd_as_pt_no_transform, pointnet2
#yhiewiof
hpms_first_dmaps:
  truncation_psi: 0.25
  truncation_cutoff: 14


pretrained_modules:
  old_G_ema: True #nb only do this is lambda_sigma_l1 > 0


