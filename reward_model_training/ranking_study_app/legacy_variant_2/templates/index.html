<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Ranking</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <h1>Rank the Images</h1>
        <div class="row">
            <div class="col-md-6">
                <h3>Image 1</h3>
                <img src="{{ images[0] }}" class="img-fluid" id="image1">
            </div>
            <div class="col-md-6">
                <h3>Image 2</h3>
                <img src="{{ images[1] }}" class="img-fluid" id="image2">
            </div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <h3>Image 3</h3>
                <img src="{{ images[0] }}" class="img-fluid" id="image3">
            </div>
            <div class="col-md-6">
                <h3>Image 4</h3>
                <img src="{{ images[1] }}" class="img-fluid" id="image4">
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-6">
                <button class="btn btn-primary" id="vote1">Vote for Image 1</button>
            </div>
            <div class="col-md-6">
                <button class="btn btn-primary" id="vote2">Vote for Image 2</button>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-md-6">
                <button class="btn btn-primary" id="vote3">Vote for Image 3</button>
            </div>
            <div class="col-md-6">
                <button class="btn btn-primary" id="vote4">Vote for Image 4</button>
            </div>
        </div>
    </div>
    <script>
        let votes = {
            image1: 0,
            image2: 0
        };

        document.getElementById("vote1").addEventListener("click", function() {
            votes.image1++;
            nextImages();
        });

        document.getElementById("vote2").addEventListener("click", function() {
            votes.image2++;
            nextImages();
        });

        function nextImages() {
            // Check if all images have been ranked
            if (votes.image1 + votes.image2 >= {{ images|length }} - 1) {
                alert("Thank you for ranking the images!");
                // Send votes to the server via an AJAX request if needed
            } else {
                // Load the next pair of images
                window.location.reload();
            }
        }
    </script>
</body>
</html>
