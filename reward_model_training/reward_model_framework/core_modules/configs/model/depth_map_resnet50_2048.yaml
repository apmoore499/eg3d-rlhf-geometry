defaults:
  - mlps: default
  - _self_
#  - external/resnet_152
  #- external/vggface2_to_512
  - external/resnet50_to_2048_dmap
  - optimizer: null
  - scheduler: null


  
  

_target_: core_modules.models.modules_depthmap.DepthMap
n_dmaps: 1
name: DepthMap_${model.external.name}_${model.n_dmaps}
normtype: 'batch_norm'


global_feature_size: 512


act_type: 'softplus'



# 4-MLP reward head comes from `mlps: default`; only the per-backbone
# input_size is set here.
mlp_global:
  input_size: ${multiply:${multiply:${model.external.embedding_size},1},${model.n_dmaps}}



  
return_global_embedding: True


compile: False

loss:
  return_global_embedding: True
  lambda_abs_sym_loss: 0.0
  lambda_BT:  1e-3 #0.0 #1e-3
  lambda_pairs: 10.0 #0.0
  lambda_scalar_rwd: 1e-3 #1e-3 #0.0
  lambda_reg_rwd_vals: 1e-8 #0.0 #1e-8 #l2 loss
  lambda_agg_features_l2: 0.0 #for agg features make sure not too high magnitude


swa: True
swa_start: 1 #start stochastic weight avg at this epo number