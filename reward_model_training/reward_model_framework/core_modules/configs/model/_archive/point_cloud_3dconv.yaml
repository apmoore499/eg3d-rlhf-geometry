defaults:
  - _self_
  - optimizer: null
  - scheduler: null
  - /data/augmentations: nose_512

_target_: core_modules.models.modules_conv3d.Conv3DNetworkEnsemble
name: Conv3DNetworkEnsemble


global_feature_size: 512


act_type: 'cos'

mlp_global:
  _target_: core_modules.models.utils_base.MLP
  input_size: ${model.Conv3DModule.final_size_out}
  output_size: ${model.global_feature_size}
  hidden_sizes: [1024, 1024, 512]
  dropout_rate: 0.15
  use_dropout: False
  normalisation_type: 'none'
  activation_type: ${model.act_type}
  norm_first_layer: False
  residual: True


