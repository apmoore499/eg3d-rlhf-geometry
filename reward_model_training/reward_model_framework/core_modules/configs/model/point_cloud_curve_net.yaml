defaults:
  - mlps: default
  - _self_
  - optimizer: null
  - scheduler: null


_target_: core_modules.models.modules_curvenet.CurveNetEnsemble

name: CurveNetEnsemble
global_feature_size: 512
act_type: 'softplus'

