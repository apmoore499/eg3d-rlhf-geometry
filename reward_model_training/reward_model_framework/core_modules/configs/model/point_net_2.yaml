# 4-MLP reward head comes from `mlps: default`; only the per-backbone
# input_size is set here.
mlp_global:
  input_size: 1024

return_global_embedding: true
compile: false
external: null
loss: null
swa: True
swa_start: 1 #start stochastic weight avg at this epo number
scheduler: null

