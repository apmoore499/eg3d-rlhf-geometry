defaults:
  - model_checkpoint
  - early_stopping
  - model_summary
  - rich_progress_bar
  - wandb_images_logger
  - _self_

model_checkpoint:
  dirpath: ${trainer.default_root_dir}/wandb/checkpoints
  filename: "epoch_{epoch:03d}"
  monitor: "val_epoch/paired_loss"  # checkpoint on the paired (pairs-head) validation loss
  mode: "min"
  save_last: False
  auto_insert_metric_name: False
  save_weights_only: True

early_stopping:
  monitor: "val_epoch/paired_loss"  # early-stop on the paired (pairs-head) validation loss
  patience: 3                       # stop after 3 epochs without improvement (paper's early stopping)
  mode: "min"
  divergence_threshold: 2.0         # abort the run if the monitored loss diverges past this
