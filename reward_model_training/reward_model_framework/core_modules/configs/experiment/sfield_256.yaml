# @package _global_
# Reported sigma-field (256^3) reward model: ResNet-SE-3D-UNet backbone + MLP heads,
# trained on the sigma_field_256 representation. Headline reward model, run 7wnzkgie.
# Backbone: model/sigma_field_3dconv.yaml. Shared losses: loss/all_losses.yaml.
#   python -m core_modules.train_rwd_model experiment=sfield_256

defaults:
  - override /model: sigma_field_3dconv        # ResNet-SE-3D-UNet backbone + MLP reward heads
  - override /trainer: default
  - override /data: data_defaults
  - override /data/augmentations: sigma_256_self_norm_no_aug  # self-normalise slab, no aug (reported)
  - override /loss: all_losses                 # 3 preference heads (pairs/scalar/BT); recon weight set below
  - override /callbacks: default
  - override /model/optimizer: adam
  - override /model/scheduler: null

tags: ["sigma field 256", "sigma volume", "3d conv net"]

trainer:
  min_epochs: 1
  max_epochs: 2                 # public test run; paper trains to max 10 epochs with early stopping
  profiler: null
  num_sanity_val_steps: 0
  limit_train_batches: 1        # public test: 1 batch/split to confirm an end-to-end train/val/test pass
  limit_val_batches: 1
  limit_test_batches: 1

loss:
  lambda_recon: 1e-2            # sigma-slab reconstruction weight (paper 10^-2); only sigma-field reconstructs, depth/pcd ignore it
  recon_type: l1               # L1 reconstruction penalty on the reconstructed sigma slab
  normalise_recon: true        # normalise reconstruction back to the input slab scale before the L1

dloader:
  num_workers: 6
  prefetch_factor: 2

model:
  act_type: 'softplus'         # MLP-head activation (mlps/default reads ${model.act_type})
  swa: null
  name: unet3d_sigma_256

batch_size_all: 1              # reward-model batch size for sigma-field (paper: 1)
prop_data: 0.05                # public test uses 5% of data; full runs use 1.0
train_ct_partition: false      # contrastive-partition leg (abandoned); no paper result uses it
train_on: datamodule_third     # top+bottom ranked-pair datamodule (the variant that worked)

# Batch-composition sampling probs (consumed in data/dset_loaders.py:221-227, 670-678):
goodseed_pred_prob: 1.0        # prob of keeping a goodseed when one is present in the batch
badseed_pred_prob: 1.0         # prob of keeping badseeds when present in the batch
augment_orig_prob: 0.0         # prob of augmenting the original seed batch (off for reported)
augment_good_prob: 0.0         # prob of augmenting goodseeds in the batch (off for reported)
keep_all_orig_prob: 1.0        # prob of keeping all original seeds in the batch
keep_all_good_prob: 1.0        # prob of keeping all goodseeds in the batch
sample_seed_pair_from_rankings: False  # if true, subsample a batch down to one ranked pair

data:
  dset_dict:
    selected_dtypes: ['sigma_field_256']     # the 256^3 sigma-density volume representation
    proportion_of_data_to_use: ${prop_data}
    badseeds_models: []        # empty = do not include extra poor-quality samples (abandoned method)
    goodmeshes:                # curated good-quality meshes added to the ranking pool
      n_train: 700
      n_test: 150
      n_val: 150
      p_add: 1.0
    remove_middle_data: true   # collapse each ranking to its best + worst entry (drop the middle ranks)
    row_size_to_keep: 2        # keep only rankings with >= this many ranked entries (>=2 needed for a pair)
    include_goodseed: true     # include curated goodseed exemplars in training

test: True
sync: True
sync_model_weights: False
optuna_tuning: False
log_net_debug: False
swa: False
