# @package _global_

defaults:
  - override /model: aw98_3d_lmks_transformer
  - override /trainer: default
  - override /data: data_defaults
  - override /loss: all_losses
  - override /model/optimizer: adamW
  - override /model/scheduler: cosine_warm_rsts
#  - override /hparams_search: tdmap_optuna

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["triple dmap","adam optimiser","32 bit precisio"]

trainer:
  min_epochs: 1
  max_epochs: 15
  profiler: null #"advanced"
  num_sanity_val_steps: 0
  precision: 32
  #limit_train_batches: 3
  #limit_val_batches: 3
  #limit_val_batches: 0.1
  #limit_test_batches: 0.1
  #val_check_interval: 0.25

model:

  num_heads: 8
  cross_attention_dropout: 0.2
  embed_dim: 256
  encoder_dropout: 0.0

  #sel_region_for_masking: RHS_face_idx

          # sel_regions=['LHS_face_idx',
          #            'RHS_face_idx',
          #            'nose_ridge_idx',
          #            'nose_ridge_idx',
          #            'nose_idx',
          #            'nose_idx',
          #            'left_eye_idx',
          #            'right_eye_idx']

  # scheduler: 
  #   _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  #   _partial_: true
  #   eta_min: 1e-6
  #   T_0: 300

  # optimizer:
  #   _target_: torch.optim.SGD
  #   _partial_: true
  #   lr:           0.025
  #   momentum: 0.9
  #   weight_decay: 0.0005
  #   #weight_decay: 1e-4
  #   #momentum: 0.9

  
  act_type: 'cos'

  swa: null

# python train_rwd_model.py experiment=triple_modules_depthmap_resnet_50.yaml prop_data=1.0 dloader.num_workers=6 data.dset_dict.remove_middle_data=false

batch_size_all: 8
prop_data: 1.0


data:
  dset_dict:
    selected_dtypes: ['aw98_3d_lmks']  # renamed from aw98_3d_centroids (PCD-sampled keypoints)
    proportion_of_data_to_use: ${prop_data}



    goodmeshes:
      # NB: total n good meshes is 98
      # Therefore, can be leq 98`
      # do not use perceantages integer only
      n_train: 60 #40
      n_test: 0
      n_val: 10 #10
      p_add: 1.0

    remove_middle_data: true
    row_size_to_keep: 6


    margin_for_offset_testing: 0.4 # between 0.0 and0.5, if the p(win) = 1-p(lose) + margin, consider a win.ONLY USED IN TEST SET

#pcd_square_nose


  # optimizer:
  #   _target_: sharpness_aware_optimiser.SAM
  #   _partial_: true
  #   lr: 0.039452414071175945
  #   adaptive: true
  #   rho: 0.1


  # scheduler:
  #   _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  #   _partial_: true
  #   eta_min: 1e-6

  

train_on: datamodule_third

  
loss:
  return_global_embedding: True
  lambda_abs_sym_loss: 0.0
  #lambda_BT:  0.0 #0.0 #1e-3 #0.0 #1e-3
  lambda_BT: 0.0 #1e-3 #0.0 #1e-3 #1e-3 #0.0 #1e-3
  lambda_pairs: 1.0 #0.0
  #lambda_scalar_rwd: 0.0 #0.0 #1e-3 #1e-3 #0.0
  lambda_scalar_rwd: 0.0 #1e-3 #0.0 #1e-3 #1e-3 #1e-3 #0.0
  lambda_reg_rwd_vals: 0.0 #1e-8 #0.0 #1e-8 #0.0 #1e-8 #l2 loss
  lambda_agg_features_l2: 0.0 #for agg features make sure not too high magnitude


test: True
sync: True
sync_model_weights: False
optuna_tuning: False
log_net_debug: False
#logger.wandb.offline: False



swa: False






