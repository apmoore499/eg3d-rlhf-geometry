# @package _global_

defaults:
  - override /model: sigma_rays_3dconv
  - override /trainer: default
  - override /data: data_defaults
  - override /loss: pair_loss_only
  - override /model/optimizer: adam
  - override /callbacks: default
#  - override /model/scheduler: cosine_warm_rsts
#  - override /hparams_search: tdmap_optuna
# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["triple dmap","adam optimiser","32 bit precisio"]

callbacks:
  early_stopping:
    patience: 15


trainer:
  min_epochs: 1
  max_epochs: 15
  profiler: null #"advanced"
  num_sanity_val_steps: 0
  precision: 32
  #overfit_batches: 4
  #limit_train_batches: 3
  #limit_val_batches: 3
  #limit_val_batches: 0.1
  #limit_test_batches: 0.1
  #val_check_interval: 0.25

model:

  num_heads: 8
  cross_attention_dropout: 0.2
  encoder_dropout: 0.0
  self_attention_dropout: 0.2

  sel_region_for_masking: RHS_face_idx

  n_3d_fmaps: 256

          # sel_regions=['LHS_face_idx',
          #            'RHS_face_idx',
          #            'nose_ridge_idx',
          #            'nose_ridge_idx',
          #            'nose_idx',
          #            'nose_idx',
          #            'left_eye_idx',
          #            'right_eye_idx']


  act_type: 'cos'
  swa: null

  optimizer:
    lr: 1e-4
    weight_decay: 0

# python train_rwd_model.py experiment=triple_modules_depthmap_resnet_50.yaml prop_data=1.0 dloader.num_workers=6 data.dset_dict.remove_middle_data=false


dloader:
  num_workers: 0


batch_size_all: 4
prop_data: 1.0




data:
  dset_dict:
    selected_dtypes: ['sigma_rays']
    proportion_of_data_to_use: ${prop_data}



    goodmeshes:
      # NB: total n good meshes is 98
      # Therefore, can be leq 98`
      # do not use perceantages integer only
      n_train: 60 #40
      n_test: 0
      n_val: 10 #10
      p_add: 1.0

    remove_middle_data: true
    row_size_to_keep: 6


    margin_for_offset_testing: 0.4 # between 0.0 and0.5, if the p(win) = 1-p(lose) + margin, consider a win.ONLY USED IN TEST SET


train_on: datamodule_third

  


test: True
sync: False
sync_model_weights: False
optuna_tuning: False
log_net_debug: False
#logger.wandb.offline: False
swa: False






#trainer.max_epochs=1

