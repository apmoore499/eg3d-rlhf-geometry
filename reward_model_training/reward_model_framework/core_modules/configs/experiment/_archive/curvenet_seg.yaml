# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /model: point_cloud_curve_net_seg
  - override /trainer: default
  - override /data: data_defaults
  - override /loss: all_losses

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["sam_optimiser"]

trainer:
  min_epochs: 1
  max_epochs: 10
  profiler: null #"advanced"
  num_sanity_val_steps: 0
  precision: 32
  limit_train_batches: 0.5
  #limit_val_batches: 0.1
  #limit_test_batches: 0.1
  #val_check_interval: 0.25

model:

  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr:           1e-5
    weight_decay: 1e-4


# python train_rwd_model.py experiment=curvenet.yaml prop_data=1.0 dloader.num_workers=6 data.dset_dict.remove_middle_data=false
  # optimizer:
  #   _target_: sharpness_aware_optimiser.SAM
  #   _partial_: true
  #   lr: 0.04308684547020105
  #   adaptive: true
  #   rho: 0.1


  # scheduler:
  #   _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  #   _partial_: true
  #   eta_min: 1e-6

  


train_on: datamodule_third


prop_data: 1.0


data:
  dset_dict:
    selected_dtypes: ['point_cloud_permute_downsample']
    proportion_of_data_to_use: ${prop_data}

    goodmeshes:
      # NB: total n good meshes is 98
      # Therefore, can be leq 98
      # do not use perceantages integer only
      n_train: 60 #40
      n_test: 0
      n_val: 10 #10
      p_add: 1.0

    remove_middle_data: true







    point_cloud_permute_downsample:
      n_point_samples_per_pcd_batch: 2048

batch_size_all: 4













test: True
sync: True
sync_model_weights: False
optuna_tuning: False
log_net_debug: False
#logger.wandb.offline: False




