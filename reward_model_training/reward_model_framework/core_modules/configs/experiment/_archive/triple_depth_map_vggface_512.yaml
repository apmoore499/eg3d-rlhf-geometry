# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /model: modules_depthmap_vggface512
  - override /trainer: default
  - override /data: data_defaults
  - override /loss: all_losses

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["triple dmap","adam optimiser","32 bit precisio"]


trainer:
  min_epochs: 1
  max_epochs: 10
  profiler: null #"advanced"
  num_sanity_val_steps: 0
  precision: 32
  limit_train_batches: 0.5
  #limit_val_batches: 0.1
  #limit_test_batches: 0.1
  #val_check_interval: 0.25

model:
  n_dmaps: 3
  #sel_dmaps: 0,2

  optimizer:
    _target_: torch.optim.Adam
    _partial_: true
    lr:           1e-5
    weight_decay: 1e-4


  # scheduler: 
  #   _target_: torch.optim.lr_scheduler.CosineAnnealingWarmRestarts
  #   _partial_: true
  #   eta_min: 1e-6
  #   T_0: 300

  # optimizer:
  #   _target_: torch.optim.SGD
  #   _partial_: true
  #   lr:           0.025
  #   momentum: 0.9
  #   weight_decay: 0.0005
  #   #weight_decay: 1e-4
  #   #momentum: 0.9

  
  act_type: 'cos'

# python train_rwd_model.py experiment=triple_modules_depthmap_resnet_50.yaml prop_data=1.0 dloader.num_workers=6 data.dset_dict.remove_middle_data=false

batch_size_all: 8
prop_data: 1.0


data:
  dset_dict:
    selected_dtypes: ['triple_dmap']
    proportion_of_data_to_use: ${prop_data}

    goodmeshes:
      # NB: total n good meshes is 98
      # Therefore, can be leq 98
      # do not use perceantages integer only
      n_train: 60 #40
      n_test: 0
      n_val: 10 #10
      p_add: 1.0

    remove_middle_data: true



  # optimizer:
  #   _target_: sharpness_aware_optimiser.SAM
  #   _partial_: true
  #   lr: 0.039452414071175945
  #   adaptive: true
  #   rho: 0.1


  # scheduler:
  #   _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  #   _partial_: true
  #   eta_min: 1e-6

  

train_on: datamodule_third

  
loss:
  return_global_embedding: True
  lambda_abs_sym_loss: 0.0
  #lambda_BT:  0.0 #0.0 #1e-3 #0.0 #1e-3
  lambda_BT:  1e-3 #0.0 #1e-3
  lambda_pairs: 1.0 #0.0
  #lambda_scalar_rwd: 0.0 #0.0 #1e-3 #1e-3 #0.0
  lambda_scalar_rwd: 1e-3 #1e-3 #0.0
  lambda_reg_rwd_vals: 1e-8 #0.0 #1e-8 #l2 loss
  lambda_agg_features_l2: 0.0 #for agg features make sure not too high magnitude


test: True
sync: True
sync_model_weights: False
optuna_tuning: False
log_net_debug: False
#logger.wandb.offline: False







