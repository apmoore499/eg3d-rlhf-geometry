# @package _global_

defaults:
  - override /model: depth_map_resnet50_2048
  - override /trainer: default
  - override /data: data_defaults
  - override /loss: all_losses
  - override /model/optimizer: adam
  - override /model/scheduler: null
  - override /data/augmentations: depth_map_maps_transforms_default

tags: ["single dmap", "resnet-50"]

trainer:
  min_epochs: 1
  max_epochs: 10
  profiler: null
  num_sanity_val_steps: 0

model:
  n_dmaps: 1
  swa: null
  external:
    maps_transforms: ${data.augmentations.model_maps_transforms}
  act_type: "softplus"

batch_size_all: 8
prop_data: 1.0

dloader:
  prefetch_factor: null
  num_workers: 0

data:
  dset_dict:
    selected_dtypes: ["single_dmap"]
    proportion_of_data_to_use: ${prop_data}
    badseeds_models: []

    goodmeshes:
      n_train: 700
      n_test: 150
      n_val: 150
      p_add: 1.0

    remove_middle_data: true
    row_size_to_keep: 6
    include_goodseed: true

train_on: datamodule_third

goodseed_pred_prob: 1.0
badseed_pred_prob: 1.0
augment_orig_prob: 0.0
augment_good_prob: 0.0
keep_all_orig_prob: 1.0
keep_all_good_prob: 1.0
sample_seed_pair_from_rankings: False

test: True
sync: True
sync_model_weights: False
optuna_tuning: False
log_net_debug: False
swa: False
debug: False
