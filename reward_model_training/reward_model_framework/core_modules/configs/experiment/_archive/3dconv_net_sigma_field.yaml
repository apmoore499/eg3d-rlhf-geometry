# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /model: point_cloud_3dconv
  - override /trainer: default
  - override /data: data_defaults
  - override /loss: all_losses
  - override /model/optimizer: adam
  - override /callbacks: default
#  - override /model/scheduler: cosine_warm_rsts
# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["adam_optimiser","3d conv net"]

trainer:
  min_epochs: 1
  max_epochs: 5
  profiler: null #"advanced"
  num_sanity_val_steps: 0

model:
  act_type: 'cos'
  swa: null


  Conv3DModule:
    _target_: core_modules.models.modules_conv3d.Conv3DNetwork #(final_size=self.hparams.mlp_global.input_size) #53568
    final_size_out: 1024
    #final_size_in: 53568
    #check_vox: False
#Conv3DNetworkLeftToRight

batch_size_all: 4
prop_data: 1.0


train_on: datamodule_third


data:
  dset_dict:
    selected_dtypes: ['sigma_field_256'] #sigma_rays #nose512 am 20122025
    proportion_of_data_to_use: ${prop_data}



    goodmeshes:
      # NB: total n good meshes is 98
      # Therefore, can be leq 98`
      # do not use perceantages integer only
      n_train: 60 #40
      n_test: 0
      n_val: 10 #10
      p_add: 1.0

    remove_middle_data: true
    row_size_to_keep: 6

    margin_for_offset_testing: 0.4 # between 0.0 and0.5, if the p(win) = 1-p(lose) + margin, consider a win.ONLY USED IN TEST SET




test: True
sync: True
sync_model_weights: False
optuna_tuning: False
log_net_debug: False
#logger.wandb.offline: False
swa: False



#Conv3DNetworkSTD