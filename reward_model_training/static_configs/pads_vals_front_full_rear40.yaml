# Sigma-volume crop "slab": *_pad = fraction trimmed inward from each face of the
# EG3D sigma density field (0 = keep full; larger = tighter crop). front/rear =
# depth axis (face / back of head), top/bot = vertical, lhs/rhs = horizontal.
# shape_res = sigma sampling resolution.
# "front_full_rear40": full front (front_pad 0) + 40% trimmed off the rear, @256.
# THE winner reward model (7wnzkgie) input slab — keeps the front floater region.
bot_pad: 0.25
front_pad: 0.0
lhs_pad: 0.25
rear_pad: 0.4
rhs_pad: 0.25
top_pad: 0.2
shape_res: 256
